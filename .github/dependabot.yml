version: 2

updates:
  # Dev tooling (biome, lightningcss-cli) referenced by the root package.json
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
      npm-major:
        update-types: ["major"]

  # Images referenced by compose.yaml (ghost, mysql).
  # `docker-compose` is GA since 2025-02-25 (github.blog/changelog/
  # 2025-02-25-dependabot-version-updates-now-support-docker-compose-
  # in-general-availability). The legacy `docker` ecosystem only
  # scans Dockerfiles / Kubernetes YAML, neither of which this repo has.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7

  # Action versions inside .github/workflows/
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      actions-minor-and-patch:
        update-types: ["minor", "patch"]
      actions-major:
        update-types: ["major"]
