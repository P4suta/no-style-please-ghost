name: zizmor

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zizmor:
    name: Actions security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v8.0.0

      - name: Seed empty SARIF
        run: |
          printf '%s\n' '{"version":"2.1.0","runs":[]}' > zizmor.sarif

      - name: zizmor
        run: uvx zizmor --format sarif . > zizmor.sarif
        continue-on-error: true

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4.35.1
        with:
          sarif_file: zizmor.sarif
          category: zizmor
