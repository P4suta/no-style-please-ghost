name: zizmor

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zizmor:
    name: Actions security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Seed empty SARIF
        # Ensures a valid SARIF always exists for the upload step, even
        # if zizmor aborts before producing its own output (e.g. invalid
        # config). zizmor findings themselves still fail the job — this
        # step is just a safety net against empty uploads, not a way to
        # suppress scan results.
        run: |
          printf '%s\n' '{"version":"2.1.0","runs":[]}' > zizmor.sarif

      - name: zizmor
        # No `continue-on-error` — findings must fail the job so that
        # they are addressed, not silently uploaded. Fix the workflow
        # (or, if truly unavoidable, document an explicit zizmor config
        # exemption with justification in the repo).
        run: uvx zizmor --format sarif . > zizmor.sarif

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@e46ed2cbd01164d986452f91f178727624ae40d7 # v4.35.3
        with:
          sarif_file: zizmor.sarif
          category: zizmor
