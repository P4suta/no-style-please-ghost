name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gscan:
    name: GScan (theme validator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile
      - run: bun run gscan

  biome:
    name: Biome format + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile
      - run: bun run check

  css-build:
    name: CSS build drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile
      - name: Rebuild bundled CSS
        run: bun run build:css
      - name: Fail if built CSS drifts from source
        run: |
          if ! git diff --exit-code theme/no-style-please-ghost/assets/css/style.css; then
            echo "::error::theme/no-style-please-ghost/assets/css/style.css is out of sync with src/css/. Run 'task build' (or 'bun run build:css') and commit." >&2
            exit 1
          fi

  reader-tests:
    name: Reading journeys and upload archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun x playwright install --with-deps --only-shell chromium firefox webkit
      - run: bun run test

  compose-smoke:
    name: Compose up smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Prepare environment
        run: cp .env.example .env

      - name: Build / pull images and wait for healthy services
        run: docker compose up -d --wait

      - name: Hit Ghost root
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error --output /dev/null http://localhost:2368/; then
              echo "Ghost responded on try $i"
              exit 0
            fi
            sleep 2
          done
          echo "Ghost did not respond in time" >&2
          exit 1

      - name: Dump ghost logs on failure
        if: failure()
        run: docker compose logs ghost

      - name: Tear down
        if: always()
        run: docker compose down -v

  actionlint:
    name: Actions lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
