name: Release proposal

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  propose:
    name: Propose versions and prepare drafts
    if: github.ref == 'refs/heads/main' && github.ref_protected && vars.RELEASE_PROPOSALS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-please
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      release_id: ${{ steps.release.outputs.id }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Read the release App credentials
        id: credentials
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
          doppler-project: no-style-please-ghost
          doppler-config: automation
          inject-env-vars: false
      - name: Mint a repository installation token
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ steps.credentials.outputs.GITHUB_APP_CLIENT_ID }}
          private-key: ${{ steps.credentials.outputs.GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - name: Prepare the release PR or its draft
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app.outputs.token }}

  distribute:
    name: Start verification on the version tag
    needs: propose
    if: needs.propose.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write # Dispatch the release build on its original tag.
    steps:
      - name: Dispatch the build for the existing draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.propose.outputs.release_id }}
          TAG: ${{ needs.propose.outputs.tag }}
        shell: bash
        run: |
          [[ "$RELEASE_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh workflow run publish-theme.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG" --field "release_id=$RELEASE_ID"
