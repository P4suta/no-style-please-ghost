name: no-style-please-ghost

services:
  ghost:
    image: ghost:6-alpine
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${GHOST_HOST_PORT:-2368}:2368"
    environment:
      url: ${GHOST_URL:-http://localhost:2368}
      database__client: mysql
      database__connection__host: mysql
      database__connection__user: ${MYSQL_USER}
      database__connection__password: ${MYSQL_PASSWORD}
      database__connection__database: ${MYSQL_DATABASE}
      NODE_ENV: ${NODE_ENV:-development}
    volumes:
      - ghost-content:/var/lib/ghost/content
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:2368/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: ${GHOST_START_PERIOD:-45m}
      start_interval: 5s
    restart: unless-stopped

  mysql:
    image: mysql:9
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP --host=127.0.0.1
          --user="$${MYSQL_USER}" --database="$${MYSQL_DATABASE}" --execute="SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: ${MYSQL_START_PERIOD:-10m}
      start_interval: 5s
    restart: unless-stopped

volumes:
  ghost-content:
  mysql-data:
