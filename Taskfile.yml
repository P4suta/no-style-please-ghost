version: "3"

# Convention: no Ghost, Bun, or Node on the host. Every task either
# shells out to `docker compose` or runs a throw-away
# `oven/bun:1-alpine` container. Bun doubles as package manager
# (`bun install`) and task runner (`bun run <script>`), so the same
# image covers install, build, lint, format, and theme validation.

vars:
  COMPOSE: docker compose
  BUN_IMAGE: oven/bun:1-alpine
  # `gscan` is the only tool we keep on Node: docs.ghost.org's theme
  # validator documentation recommends `npm install -g gscan` on a Node
  # runtime, and gscan v6.0.1 has a latent bug in `lib/checker.js` that
  # assumes `fs.readdirSync` returns entries alphabetically. On bun
  # 1.3.13 the entries are returned in filesystem order (upstream fix:
  # oven-sh/bun#26570, still open), which makes check `120` run before
  # `040` and produces false-positive `{{ghost_head}}` warnings. Running
  # gscan under Node/npm sidesteps the mismatch until either side fixes
  # it upstream.
  NODE_IMAGE: node:lts-alpine
  # Mount the current directory as /work, drop back to the invoking
  # user's UID/GID so files written by the container stay owned by the
  # host user, and redirect bun's cache to /tmp (HOME is read-only in
  # some Docker setups).
  BUN_RUN: >-
    docker run --rm
    -u "$(id -u):$(id -g)"
    -v "$PWD:/work"
    -w /work
    -e HOME=/tmp
    {{.BUN_IMAGE}}

tasks:
  default:
    cmds:
      - task --list
    silent: true

  # ---------- Compose lifecycle ----------
  up:
    desc: Start Ghost + MySQL in distribution mode (no theme bind-mount — upload the zip manually from /ghost/).
    # Explicitly ignores compose.override.yaml, so this matches what an
    # end user sees on first install: a vanilla Ghost with no theme
    # pre-provisioned. Pair with `task zip` to get the .zip for upload.
    cmd: "{{.COMPOSE}} -f compose.yaml up -d --wait"

  dev:
    desc: Start Ghost + MySQL with the theme bind-mounted for hot edits.
    # `docker compose` auto-merges compose.override.yaml on top of
    # compose.yaml, which is where the theme bind-mount and
    # NODE_ENV=development live.
    cmd: "{{.COMPOSE}} up -d --wait"

  down:
    desc: Stop the stack (keeps named volumes).
    cmd: "{{.COMPOSE}} down"

  logs:
    desc: Tail Ghost logs.
    cmd: "{{.COMPOSE}} logs -f ghost"

  restart:
    desc: Restart Ghost (picks up theme package.json changes).
    cmd: "{{.COMPOSE}} restart ghost"

  ps:
    desc: Show container status.
    cmd: "{{.COMPOSE}} ps"

  config:
    desc: Render the effective Compose config (base + override).
    cmd: "{{.COMPOSE}} config"

  # ---------- Distribution ----------
  zip:
    desc: Build the theme CSS and package it as dist/no-style-please-ghost-<version>.zip.
    deps: [build]
    # `apk add` needs root, so this container runs as root and then
    # chowns the resulting zip back to the host UID/GID — otherwise
    # the file ends up root-owned and hard to clean up from the host.
    cmd: |
      mkdir -p dist
      docker run --rm \
        -v "$PWD:/work" -w /work \
        -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
        alpine:latest \
        sh -c 'apk add --no-cache --quiet zip jq >/dev/null 2>&1 \
               && VER=$(jq -r .version theme/no-style-please-ghost/package.json) \
               && rm -f "dist/no-style-please-ghost-$VER.zip" \
               && cd theme/no-style-please-ghost \
               && zip -rq "/work/dist/no-style-please-ghost-$VER.zip" . -x "src/*" \
               && chown "$HOST_UID:$HOST_GID" "/work/dist/no-style-please-ghost-$VER.zip" \
               && echo "Built dist/no-style-please-ghost-$VER.zip"'

  # ---------- Dev tooling (bun one-shots) ----------
  install:
    desc: Install dev dependencies with bun.
    cmd: "{{.BUN_RUN}} bun install --no-progress"

  build:
    desc: Build theme CSS (Lightning CSS bundle + minify).
    cmd: "{{.BUN_RUN}} bun run build:css"

  watch:
    desc: Rebuild CSS on src/css/**/*.css changes (Ctrl-C to stop).
    cmd: "{{.BUN_RUN}} bun run watch:css"

  gscan:
    desc: Validate the theme with Ghost's GScan (docs.ghost.org pattern).
    # Ghost documentation uses `npm install -g gscan` on Node; we follow
    # that exactly rather than wrapping it in bun — see the NODE_IMAGE
    # comment at the top of this file for the reason.
    cmd: |
      docker run --rm -v "$PWD/theme/no-style-please-ghost:/theme:ro" {{.NODE_IMAGE}} \
        sh -c "npm install --no-progress --no-audit --silent -g gscan && gscan /theme"

  check:
    desc: Biome format + lint check (read-only).
    cmd: "{{.BUN_RUN}} bun run check"

  fix:
    desc: Biome format + lint with auto-fix applied.
    cmd: "{{.BUN_RUN}} bun run check:fix"

  format:
    desc: Biome format only (write).
    cmd: "{{.BUN_RUN}} bun run format"

  lint:
    desc: Biome lint only (read-only).
    cmd: "{{.BUN_RUN}} bun run lint"
