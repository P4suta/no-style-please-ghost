version: "3"

vars:
  BUN_IMAGE: oven/bun:1.4.4-alpine
  BUN_RUN: >-
    docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp
    -v "$PWD:/work" -v "$PWD/.docker-modules:/work/node_modules"
    -w /work {{.BUN_IMAGE}}

tasks:
  default:
    silent: true
    cmd: task --list
  up:
    desc: Start Ghost and MySQL for ZIP uploads.
    cmd: docker compose -f compose.yaml up -d --wait
  dev:
    desc: Start Ghost with the working theme mounted.
    cmd: docker compose up -d --wait
  down:
    desc: Stop Ghost and keep its data.
    cmd: docker compose down
  logs:
    desc: Follow the Ghost log.
    cmd: docker compose logs -f ghost
  ps:
    desc: Show the Ghost and MySQL service status.
    cmd: docker compose ps
  restart:
    desc: Reload the active theme.
    cmd: docker compose restart ghost
  config:
    desc: Print the effective Compose configuration.
    cmd: docker compose config
  install:
    desc: Install the locked development tools for the container.
    cmds:
      - mkdir -p .docker-modules
      - "{{.BUN_RUN}} bun install --frozen-lockfile"
  build:
    desc: Build the theme stylesheet.
    cmd: "{{.BUN_RUN}} bun run build:css"
  watch:
    desc: Rebuild the stylesheet when its sources change.
    cmd: "{{.BUN_RUN}} bun run watch:css"
  zip:
    desc: Build the upload archive in dist.
    cmd: "{{.BUN_RUN}} bun run zip"
  check:
    desc: Check formatting and lint rules.
    cmd: "{{.BUN_RUN}} bun run check"
  fix:
    desc: Apply Biome fixes.
    cmd: "{{.BUN_RUN}} bun run check:fix"
  format:
    desc: Format the source files.
    cmd: "{{.BUN_RUN}} bun run format"
  lint:
    desc: Lint the source files.
    cmd: "{{.BUN_RUN}} bun run lint"
  gscan:
    desc: Validate the theme with the locked GScan on Node.js.
    cmd: >-
      docker run --rm -v "$PWD:/work:ro" -v "$PWD/.docker-modules:/work/node_modules:ro"
      -w /work node:24-alpine node node_modules/gscan/bin/cli.js theme/no-style-please-ghost
  test:
    desc: Run the host test suite with a disposable Ghost container.
    cmd: bun run test
